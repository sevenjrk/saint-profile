<style>
/* Страница профиля Saint по ссылке. Данные — только из функции get_shared_profile,
   в разметку попадают через textContent; картинки и ссылки проверяются. */
:root {
  --bg: #0d0d0d; --surface: #1a1a1a; --surface-2: #242424; --text: #fff; --text-2: #ffffffb3; --text-3: #ffffff80;
  --accent: #ff8284; --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent); --accent-glow: color-mix(in srgb, var(--accent) 35%, transparent);
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif; --font-display: "Unbounded", "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
a { color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 48px; }
.banner { height: clamp(140px, 28vw, 230px); border-radius: 22px; background-size: cover; background-position: center; position: relative; }
.banner::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(transparent 40%, #0d0d0dd9); }
.head { display: flex; gap: 22px; align-items: flex-end; margin: -64px 8px 0; position: relative; flex-wrap: wrap; }
.avatar { width: 128px; height: 128px; border-radius: 50%; border: 5px solid var(--bg); background: var(--surface); overflow: hidden; display: grid; place-items: center; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who { min-width: 0; flex: 1; padding-bottom: 6px; }
.name { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 6vw, 36px); margin: 0 0 6px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plan { font-family: var(--font); font-size: 11px; font-weight: 800; letter-spacing: 0.06em; padding: 4px 9px; border-radius: 999px; background: #ffffff14; color: var(--text-2); }
.plan.ultima { background: linear-gradient(135deg, #7a46c2, #c084fc); color: #fff; }
.plan.premium, .plan.trial { background: var(--accent-soft); color: var(--accent); }
.handle { color: var(--text-2); font-size: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.handle b { color: var(--text); }
.bio { color: var(--text-2); margin: 10px 0 0; white-space: pre-wrap; max-width: 60ch; }
.since { color: var(--text-3); font-size: 13px; margin-top: 8px; }
.top { display: grid; grid-template-columns: minmax(0, 380px) 1fr; gap: 22px; margin-top: 28px; align-items: start; }
@media (max-width: 720px) { .top { grid-template-columns: 1fr; } .head { margin-top: -56px; } .avatar { width: 104px; height: 104px; } }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border-radius: 16px; padding: 16px; }
.tile b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile span { color: var(--text-3); font-size: 13px; }
h2 { font-size: 18px; margin: 34px 0 12px; }
.bars { display: flex; gap: 6px; align-items: flex-end; height: 120px; background: var(--surface); border-radius: 16px; padding: 14px 14px 26px; position: relative; }
.bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.bar { width: 100%; max-width: 26px; border-radius: 6px 6px 3px 3px; background: linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 40%, #333)); }
.bar-col span { position: absolute; bottom: -20px; font-size: 11px; color: var(--text-3); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; min-width: 0; text-decoration: none; }
a.row:hover { background: #ffffff0a; }
.rank { width: 18px; color: var(--accent); font-weight: 800; text-align: center; flex: none; }
.cover { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); }
.rt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.rt b, .rt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rt span, .muted { color: var(--text-3); font-size: 13px; }
.modes { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.mode-seg.original { background: #fff; } .mode-seg.speedup { background: #4ade80; } .mode-seg.slowed { background: #c084fc; } .mode-seg.custom { background: #737373; }

.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.state { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px; }
.state h1 { font-family: var(--font-display); font-size: 24px; margin: 18px 0 8px; }
.spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #ffffff22; border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
footer { margin-top: 48px; color: var(--text-3); font-size: 13px; display: flex; align-items: center; gap: 10px; justify-content: center; }
.hint { color: var(--text-3); font-size: 12px; text-align: center; margin-top: 10px; }
/* Карта слушателя и оформление профиля — те же стили, что в приложении. */
/* ---------------- карта слушателя в 3D ---------------- */
.lc-scene { perspective: 1100px; width: 100%; max-width: 380px; aspect-ratio: 1.586; cursor: grab; touch-action: none; user-select: none; border-radius: 22px; outline: none; }
.lc-scene.grabbing { cursor: grabbing; }
.lc { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; will-change: transform; --gx: 50%; --gy: 35%; --hue: 0deg; --tilt: 0; }
.lc-face {
  position: absolute; inset: 0; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; color: #fff; background: var(--lc-bg);
  box-shadow: 0 24px 50px #000a, inset 0 0 0 1px #ffffff24;
}
.lc-scene:focus-visible .lc-face { box-shadow: 0 24px 50px #000a, 0 0 0 3px var(--accent); }
.lc-back { transform: rotateY(180deg); }
.lc[data-side="front"] .lc-back, .lc[data-side="back"] .lc-front { visibility: hidden; }
.lc-fx { position: absolute; inset: 0; pointer-events: none; background: var(--lc-fx, none); mix-blend-mode: var(--lc-blend, normal); opacity: var(--lc-fx-op, 1); }
.lc-glare { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--gx) var(--gy), #ffffff66 0%, #ffffff14 28%, transparent 55%); mix-blend-mode: overlay; opacity: calc(0.3 + var(--tilt) * 0.7); }
.lc-photo { position: absolute; inset: -24px; background: var(--accent) center / cover; filter: blur(14px) saturate(1.3) brightness(0.7); pointer-events: none; }
.lc-face > :not(.lc-fx):not(.lc-glare):not(.lc-photo) { position: relative; z-index: 1; }
.lc-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lc-avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none; display: grid; place-items: center; background: #0004; box-shadow: 0 0 0 2px #ffffff40; }
.lc-avatar img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.lc-who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.lc-who b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-who span { font-size: 11px; opacity: 0.75; letter-spacing: 0.04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-plan { font-size: 10px; font-weight: 800; letter-spacing: 0.16em; padding: 3px 8px; border-radius: 6px; background: #0003; border: 1px solid #ffffff30; flex: none; }
.lc-status { font-size: 12px; opacity: 0.85; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-big { font-family: var(--font-display); font-size: 36px; margin-top: auto; line-height: 1; text-shadow: 0 2px 14px #0004; }
.lc-sub { font-size: 12px; opacity: 0.8; margin: 6px 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-foot { font-size: 11px; letter-spacing: 0.12em; font-weight: 700; opacity: 0.92; }
.lc-chip { width: 32px; height: 24px; border-radius: 6px; flex: none; background: linear-gradient(135deg, #f3dc8b, #b8913a 50%, #f0d78a); box-shadow: inset 0 0 0 1px #0003; position: relative; }
.lc-chip::before { content: ""; position: absolute; inset: 5px 4px; border: 1px solid #0003; border-radius: 3px; }
.lc-num { margin-left: auto; white-space: nowrap; }
.lc-since { white-space: nowrap; }
.lc-stripe { height: 34px; margin: 2px -20px 12px; background: #000a; }
.lc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.lc-grid div { display: flex; flex-direction: column; }
.lc-grid b { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.lc-grid span { font-size: 10.5px; opacity: 0.75; }
.lc-back-info { font-size: 12px; margin: auto 0 8px; min-width: 0; }
.lc-back-info span { display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-back-info .dim { opacity: 0.7; }
.lc-sign { font-family: "Segoe Script", "Segoe Print", cursive; font-size: 13px; letter-spacing: 0; padding: 2px 10px; background: #ffffffd9; color: #222; border-radius: 4px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* отделки карты (используются и в превью в редакторе профиля) */
.lc-accent {
  --lc-bg: radial-gradient(120% 140% at 0% 0%, var(--accent) 0%, color-mix(in srgb, var(--accent) 45%, #1a0b0c) 45%, #0f0f0f 100%);

}
.lc-holo {
  --lc-bg: linear-gradient(135deg, #1b1b2f, #2b2140 50%, #16222f);
  --lc-fx: conic-gradient(from var(--hue, 0deg) at var(--gx, 50%) var(--gy, 40%), #ff7eb3, #ffd36e, #7cffcb, #6ec3ff, #c58bff, #ff7eb3);

}
.lc-carbon {
  --lc-bg: linear-gradient(135deg, #ffffff12, transparent 55%), repeating-linear-gradient(45deg, #1d1d1d 0 4px, #141414 4px 8px), #111;

}
.lc-glass {
  --lc-bg: linear-gradient(135deg, color-mix(in srgb, var(--accent) 45%, #1a1a1a), #0f0f0f);
  --lc-fx: linear-gradient(135deg, #ffffff38, #ffffff0a 60%);
}
.lc-sunset {
  --lc-bg: linear-gradient(135deg, #ff7e5f 0%, #feb47b 32%, #c2457a 68%, #3b1c5a 100%);

.lc-gold {
  --lc-bg: linear-gradient(120deg, #6f4e12 0%, #d4a93c 24%, #f8e7a6 44%, #c9972f 62%, #7a5714 100%);

.lc-gold .lc-plan { background: #2b1d0422; border-color: #2b1d0444; }

  --lc-blend: screen; --lc-fx-op: 0.55;
}
.lc-prism .lc-fx, .finish-swatch.lc-prism::after { animation: prism 7s linear infinite; }
@keyframes prism { to { filter: hue-rotate(360deg); } }

/* ---------------- профиль: рамки, имя, ссылки, достижения ---------------- */

@property --ring { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.frame-accent { border-color: var(--accent) !important; }
.frame-gradient { border-color: transparent !important; background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--accent), #ffffff 50%, color-mix(in srgb, var(--accent) 60%, #6c7dff)) border-box !important; }

@keyframes ring-spin { to { --ring: 360deg; } }

.name-gradient { background: linear-gradient(90deg, var(--accent), #ffffff 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  const NAMES = ["gradient", "shimmer"];
  const LINKS = { telegram: "Telegram", soundcloud: "SoundCloud", instagram: "Instagram", youtube: "YouTube", vk: "VK", site: "Сайт" };
  const PLAN = { free: "FREE", trial: "TRIAL", premium: "PREMIUM", ultima: "ULTIMA" };

  // ---- безопасные помощники ----
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  };
  const str = (v, max) => (typeof v === "string" && v.trim() ? v.trim().slice(0, max) : "");
  const num = (v) => (typeof v === "number" && isFinite(v) && v >= 0 ? v : 0);
  const img = (v) => (typeof v === "string" && (/^data:image\/(png|jpe?g|webp);base64,[a-z0-9+/=]+$/i.test(v) || /^https:\/\/[^\s"'<>()]+$/i.test(v)) ? v : "");
  const https = (v) => { try { const u = new URL(v); return u.protocol === "https:" ? u.toString() : ""; } catch { return ""; } };
  const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
  const hours = (sec) => { const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return h ? `${h} ч ${m} мин` : `${m} мин`; };
  const mark = (size) => {
    const ns = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(ns, "svg");
    s.setAttribute("viewBox", "0 0 32 32");
    s.setAttribute("width", size);
    s.setAttribute("height", size);
    s.innerHTML = '<circle cx="16" cy="16" r="15" fill="#1c1c1c"/><g transform="translate(16 16.4) scale(.8) translate(-16 -16)"><ellipse cx="16" cy="7.4" rx="5.53" ry="1.13" stroke="var(--accent)" stroke-width="1.75" fill="none"/><path d="M19.19 11.96A3.9 3.9 0 1 0 16 18.1A3.9 3.9 0 1 1 12.81 24.24" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>';
    return s;
  };
  const avatar = (src, cls, size) => {
    const a = el("div", cls);
    const u = img(src);
    if (u) { const i = el("img"); i.src = u; i.alt = ""; a.append(i); } else a.append(mark(size));
    return a;
  };

  function state(title, text) {
    app.replaceChildren();
    const s = el("div", "state");
    const box = el("div");
    box.append(mark(72), el("h1", "", title), el("p", "muted", text));
    s.append(box);
    app.append(s);
  }

  // ---- карта слушателя: наклон к курсору/пальцу, клик — перевернуть ----
  function card(d) {
    const finish = FINISHES.includes(d.cardFinish) ? d.cardFinish : "accent";
    const scene = el("div", "lc-scene");
    scene.tabIndex = 0;
    scene.title = "Нажмите, чтобы перевернуть";
    const c = el("div", `lc lc-${finish}`);
    c.dataset.side = "front";
    const pattern = PATTERNS.includes(d.cardPattern) ? d.cardPattern : "";
    const st = d.stats || {};
    const since = new Date(num(d.since) || Date.now());
    const sinceText = `${String(since.getMonth() + 1).padStart(2, "0")}/${String(since.getFullYear()).slice(2)}`;

    const front = el("div", "lc-face lc-front");
    if (finish === "glass") { const ph = el("div", "lc-photo"); const b = img(d.banner); if (b) ph.style.backgroundImage = `url("${b}")`; front.append(ph); }
    front.append(el("div", "lc-fx"));
    if (pattern) front.append(el("div", `lc-pattern pat-${pattern}`));
    const r1 = el("div", "lc-row");
    const who = el("div", "lc-who");
    who.append(el("b", "", str(d.name, 40) || "Слушатель"), el("span", "", str(d.handle, 24) ? `@${str(d.handle, 24)}` : "карта слушателя"));
    r1.append(avatar(d.avatar, "lc-avatar", 40), who, el("span", "lc-plan", PLAN[d.plan] || "FREE"));
    front.append(r1);
    if (str(d.status, 60)) front.append(el("div", "lc-status", str(d.status, 60)));
    front.append(el("div", "lc-big", hours(num(st.totalSec))), el("div", "lc-sub", "музыки прослушано"));
    const foot = el("div", "lc-row lc-foot");
    foot.append(el("span", "lc-chip"), el("span", "lc-num", "•••• SAINT"), el("span", "lc-since", `с ${sinceText}`));
    front.append(foot, el("div", "lc-glare"));

    const back = el("div", "lc-face lc-back");
    back.append(el("div", "lc-fx"));
    if (pattern) back.append(el("div", `lc-pattern pat-${pattern}`));
    back.append(el("div", "lc-stripe"));
    const grid = el("div", "lc-grid");
    const cell = (b, s) => { const x = el("div"); x.append(el("b", "", b), el("span", "", s)); return x; };
    grid.append(cell(hours(num(st.totalSec)), "прослушано"), cell(num(st.plays), plural(num(st.plays), "трек", "трека", "треков")), cell(num(st.artists), plural(num(st.artists), "исполнитель", "исполнителя", "исполнителей")), cell(num(st.streak), `${plural(num(st.streak), "день", "дня", "дней")} подряд`));
    back.append(grid);
    const info = el("div", "lc-back-info");
    if (d.favorite && str(d.favorite.title, 120)) info.append(el("span", "", `♥ ${str(d.favorite.title, 120)} — ${str(d.favorite.artist, 120)}`));
    if (str(d.tagline, 40)) info.append(el("span", "lc-tagline", `«${str(d.tagline, 40)}»`));
    back.append(info);
    const bf = el("div", "lc-row lc-foot");
    bf.append(el("span", "lc-sign", str(d.name, 40) || "Слушатель"), el("span", "lc-num", sinceText));
    back.append(bf, el("div", "lc-glare"));
    c.append(front, back);
    scene.append(c);

    let rx = 0, ry = 0, tx = 0, ty = 0, face = 0, raf = 0;
    const paint = () => {
      c.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
      c.dataset.side = Math.cos((ry * Math.PI) / 180) * Math.cos((rx * Math.PI) / 180) >= 0 ? "front" : "back";
      const side = ((((ry % 360) + 540) % 360) - 180) / 180;
      c.style.setProperty("--gx", `${(50 - side * 70).toFixed(1)}%`);
      c.style.setProperty("--gy", `${(35 + rx * 1.6).toFixed(1)}%`);
      c.style.setProperty("--hue", `${(ry * 1.4 + rx * 2).toFixed(1)}deg`);
    };
    const tick = () => {
      rx += (tx - rx) * 0.12;
      ry += (ty - ry) * 0.12;
      paint();
      raf = Math.abs(tx - rx) > 0.05 || Math.abs(ty - ry) > 0.05 ? requestAnimationFrame(tick) : 0;
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
    scene.addEventListener("pointermove", (e) => {
      const r = scene.getBoundingClientRect();
      tx = -((e.clientY - r.top) / r.height - 0.5) * 18;
      ty = face + ((e.clientX - r.left) / r.width - 0.5) * 26;
      kick();
    });
    scene.addEventListener("pointerleave", () => { tx = 0; ty = face; kick(); });
    const flip = () => { face += 180; tx = 0; ty = face; kick(); };
    scene.addEventListener("click", flip);
    scene.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
    paint();
    return scene;
  }

  function render(d) {
    const accent = typeof d.accent === "string" && /^#[0-9a-f]{6}$/i.test(d.accent) ? d.accent : "#ff8284";
    document.documentElement.style.setProperty("--accent", accent);
    const name = str(d.name, 40) || "Слушатель";
    document.title = `${name} — Saint`;
    const w = el("div", "wrap");

    const banner = el("div", "banner");
    const b = img(d.banner);
    banner.style.backgroundImage = b ? `url("${b}")` : BANNERS[Number.isInteger(d.bannerPreset) ? d.bannerPreset : 0] || BANNERS[0];
    w.append(banner);

    const head = el("div", "head");
    head.append(avatar(d.avatar, `avatar ${FRAMES.includes(d.avatarFrame) ? `frame-${d.avatarFrame}` : ""}`, 104));
    const who = el("div", "who");
    const h1 = el("h1", "name");
    h1.append(el("span", NAMES.includes(d.nameStyle) ? `name-${d.nameStyle}` : "", name), el("span", `plan ${PLAN[d.plan] ? d.plan : "free"}`, PLAN[d.plan] || "FREE"));
    who.append(h1);
    if (str(d.handle, 24) || str(d.status, 60)) {
      const h = el("div", "handle");
      if (str(d.handle, 24)) h.append(el("b", "", `@${str(d.handle, 24)}`));
      if (str(d.status, 60)) h.append(el("span", "", str(d.status, 60)));
      who.append(h);
    }
    if (str(d.bio, 160)) who.append(el("p", "bio", str(d.bio, 160)));
    const links = Array.isArray(d.links) ? d.links.slice(0, 4) : [];
    const lw = el("div", "pf-links");
    for (const l of links) {
      const u = l && https(l.url);
      if (!u || !LINKS[l.kind]) continue;
      const a = el("a", `pf-link link-${l.kind}`);
      a.href = u;
      a.target = "_blank";
      a.rel = "noopener noreferrer nofollow";
      a.append(el("i"), document.createTextNode(LINKS[l.kind]));
      lw.append(a);
    }
    if (lw.childElementCount) { lw.style.marginTop = "10px"; who.append(lw); }
    if (num(d.since)) who.append(el("div", "since", `В Saint с ${new Date(d.since).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" })}`));
    head.append(who);
    w.append(head);

    const st = d.stats || {};
    const top = el("div", "top");
    const left = el("div");
    left.append(card(d), el("div", "hint", "Наведите или коснитесь карты"));
    const tiles = el("div", "tiles");
    const tile = (v, s) => { const t = el("div", "tile"); t.append(el("b", "", v), el("span", "", s)); return t; };
    tiles.append(
      tile(hours(num(st.totalSec)), "прослушано"),
      tile(num(st.plays), plural(num(st.plays), "прослушивание", "прослушивания", "прослушиваний")),
      tile(num(st.artists), plural(num(st.artists), "исполнитель", "исполнителя", "исполнителей")),
      tile(num(st.streak), `${plural(num(st.streak), "день", "дня", "дней")} подряд`),
    );
    top.append(left, tiles);
    w.append(top);

    if (Array.isArray(d.badges) && d.badges.length) {
      w.append(el("h2", "", "Достижения"));
      const bw = el("div", "pf-badges");
      for (const x of d.badges.slice(0, 12)) if (x && str(x.label, 30)) { const c = el("span", `badge-chip b-${String(x.id).replace(/[^a-z0-9]/gi, "")}`); c.append(el("i"), document.createTextNode(str(x.label, 30))); bw.append(c); }
      w.append(bw);
    }

    const trackRow = (t, rank, extra) => {
      const u = https(t.url);
      const r = el(u ? "a" : "div", "row");
      if (u) { r.href = u; r.target = "_blank"; r.rel = "noopener noreferrer nofollow"; }
      if (rank) r.append(el("span", "rank", rank));
      const cv = img(t.cover);
      if (cv) { const i = el("img", "cover"); i.src = cv; i.alt = ""; i.loading = "lazy"; r.append(i); } else r.append(el("div", "cover"));
      const rt = el("span", "rt");
      rt.append(el("b", "", str(t.title, 120)), el("span", "", str(t.artist, 120)));
      r.append(rt);
      if (extra) r.append(el("span", "muted", extra));
      return r;
    };
    if (d.favorite && str(d.favorite.title, 120)) {
      w.append(el("h2", "", "Трек профиля"), trackRow(d.favorite, "", ""));
    }

    if (Array.isArray(d.days) && d.days.length) {
      w.append(el("h2", "", "Активность за 2 недели"));
      const bars = el("div", "bars");
      const max = Math.max(600, ...d.days.map(num));
      const today = new Date();
      d.days.slice(-14).forEach((sec, i, arr) => {
        const col = el("div", "bar-col");
        const bar = el("div", "bar");
        bar.style.height = `${Math.max(2, (num(sec) / max) * 100)}%`;
        bar.style.opacity = num(sec) ? "1" : "0.25";
        const date = new Date(today);
        date.setDate(today.getDate() - (arr.length - 1 - i));
        col.title = hours(num(sec));
        col.append(bar, el("span", "", date.getDate()));
        bars.append(col);
      });
      w.append(bars);
    }

    const cols = el("div", "cols");
    if (Array.isArray(d.topArtists) && d.topArtists.length) {
      const c = el("div");
      c.append(el("h2", "", "Топ исполнителей"));
      d.topArtists.slice(0, 5).forEach((a, i) => {
        if (!Array.isArray(a)) return;
        const r = el("div", "row");
        const rt = el("span", "rt");
        rt.append(el("b", "", str(a[0], 120)));
        r.append(el("span", "rank", i + 1), rt, el("span", "muted", hours(num(a[1]))));
        c.append(r);
      });
      cols.append(c);
    }
    if (Array.isArray(d.topTracks) && d.topTracks.length) {
      const c = el("div");
      c.append(el("h2", "", "Топ треков"));
      d.topTracks.slice(0, 5).forEach((t, i) => t && c.append(trackRow(t, i + 1, `${num(t.plays)} ${plural(num(t.plays), "раз", "раза", "раз")}`)));
      cols.append(c);
    }
    if (cols.childElementCount) w.append(cols);

    if (d.modes && typeof d.modes === "object") {
      const keys = ["original", "speedup", "slowed", "custom"];
      const total = keys.reduce((a, k) => a + num(d.modes[k]), 0);
      if (total > 0) {
        w.append(el("h2", "", "Режимы"));
        const m = el("div", "modes");
        const lg = el("div", "legend");
        const label = { original: "Original", speedup: "Speed Up", slowed: "Slowed", custom: "Своя скорость" };
        for (const k of keys) {
          const seg = el("div", `mode-seg ${k}`);
          seg.style.flexGrow = String(num(d.modes[k]) / total || 0.0001);
          m.append(seg);
          const s = el("span");
          const dot = el("i", `mode-seg ${k}`);
          s.append(dot, document.createTextNode(`${label[k]} — ${Math.round((num(d.modes[k]) / total) * 100)}%`));
          lg.append(s);
        }
        w.append(m, lg);
      }
    }

    const f = el("footer");
    f.append(mark(22), el("span", "", "Saint — музыкальный плеер"));
    w.append(f);
    app.replaceChildren(w);
  }

  const id = new URLSearchParams(location.search).get("u") || location.hash.slice(1);
  if (!/^[A-Za-z0-9]{8,16}$/.test(id || "")) return state("Профиль не найден", "Проверьте ссылку — похоже, она неполная.");
  fetch(`${SB_URL}/rest/v1/rpc/get_shared_profile`, {
    method: "POST",
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify({ p_id: id }),
  })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
    .then((d) => (d && typeof d === "object" ? render(d) : state("Профиль закрыт", "Владелец закрыл доступ по этой ссылке.")))
    .catch(() => state("Не удалось загрузить профиль", "Проверьте интернет и обновите страницу."));
})();
</script>
</body>
</html>
